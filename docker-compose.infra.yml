

services:
  # --- Reverse Proxy ---
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - crm-network
      - supabase_default

  # --- CRM App ---
  app:
    build: .
    restart: always
    env_file: .env
    networks:
      - crm-network

  # --- n8n ---
  n8n:
    image: n8nio/n8n:latest
    restart: always
    environment:
      - N8N_HOST=n8n.mdrinformaticaecelulares.com.br
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.mdrinformaticaecelulares.com.br/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - crm-network

  # --- Redis ---
  redis:
    image: redis:alpine
    restart: always
    networks:
      - crm-network

  # --- Evolution API ---
  evolution:
    image: evoapicloud/evolution-api:v2.3.6
    restart: always
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=https://whatsapp.mdrinformaticaecelulares.com.br
      - CORS_ORIGIN=*
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=MDR_SECRET_TOKEN_2024
      - MANAGER_TOKEN=MDR_SECRET_TOKEN_2024
      - AUTH_TOKEN=MDR_SECRET_TOKEN_2024
      - DEL_INSTANCE_ON_DISCONNECT=false
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://mdr_user:MDR_DB_PASS_2024@db:5432/infra_db?schema=public
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_CLIENT=postgresql
      - DATABASE_SAVE_DATA_HISTORY_MESSAGES=false
      - DATABASE_SAVE_DATA_MESSAGES=true
      - DATABASE_SAVE_MESSAGES=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CHATS=true
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - REDIS_PREFIX=EVO
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX=EVO_CACHE
      - WEBHOOK_GLOBAL_URL=http://app:3000/api/webhooks/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - CHATWOOT_ENABLED=true
      - CHATWOOT_MESSAGE_READ=true
      - CHATWOOT_MESSAGE_MEDIA=true
      - CHATWOOT_IMPORT_DATABASE_CONNECTION_URI=postgresql://mdr_user:MDR_DB_PASS_2024@db:5432/chatwoot_production?schema=public&sslmode=disable
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1032750324
      - WA_VERSION=2.3000.1032750324
    volumes:
      - evolution_data:/evolution/instances
      - ./scripts/patches/chatwoot.service.js:/evolution/dist/api/integrations/chatbot/chatwoot/services/chatwoot.service.js
    depends_on:
      - db
      - redis
    networks:
      - crm-network

  # --- Postgres (Shared for infra) ---
  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      - POSTGRES_PASSWORD=MDR_DB_PASS_2024
      - POSTGRES_USER=mdr_user
      - POSTGRES_DB=infra_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - crm-network

  # --- Chatwoot Web ---
  chatwoot-web:
    image: chatwoot/chatwoot:v4.12.1
    restart: always
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - PORT=3000
      - FRONTEND_URL=https://chat.mdrinformaticaecelulares.com.br
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=mdr_user
      - POSTGRES_PASSWORD=MDR_DB_PASS_2024
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY_BASE=a3f89cd712b5e401fa8e9bc20d6f8a8b1c2e3d4f5g6h7i8j9k0l1m2n3o4p5q6r
      - ACTIVE_STORAGE_SERVICE=local
      - ENABLE_RACK_ATTACK=false
      - FB_APP_ID=1635946754376101
      - FB_APP_SECRET=447922b92e661154400d90b82757a8c2
      - FB_VERIFY_TOKEN=IGAAWJZCiv2xR5BZAGJrTElPR3Y3bnFGcDBfeS1iS3h2VTJaVzA1eEdMUEkwQ0ZAvMlk4MnM1Qm1pbHNSN0c0cExCY25Qcm1DTkVwc2gzSHliX0xmckF0V01IVmViUE9QdlRnNGlKSWdnb1pzbFQ2R2M0VTMyNDFIc0pwek5WdmtlMAZDZD
      - IG_VERIFY_TOKEN=IGAAWJZCiv2xR5BZAGJrTElPR3Y3bnFGcDBfeS1iS3h2VTJaVzA1eEdMUEkwQ0ZAvMlk4MnM1Qm1pbHNSN0c0cExCY25Qcm1DTkVwc2gzSHliX0xmckF0V01IVmViUE9QdlRnNGlKSWdnb1pzbFQ2R2M0VTMyNDFIc0pwek5WdmtlMAZDZD
      - INSTAGRAM_VERIFY_TOKEN=IGAAWJZCiv2xR5BZAGJrTElPR3Y3bnFGcDBfeS1iS3h2VTJaVzA1eEdMUEkwQ0ZAvMlk4MnM1Qm1pbHNSN0c0cExCY25Qcm1DTkVwc2gzSHliX0xmckF0V01IVmViUE9QdlRnNGlKSWdnb1pzbFQ2R2M0VTMyNDFIc0pwek5WdmtlMAZDZD
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      - db
      - redis
