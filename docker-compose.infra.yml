

services:
  # --- Reverse Proxy ---
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - crm-network
      - supabase_default

  # --- CRM App ---
  app:
    build: .
    restart: always
    env_file: .env
    networks:
      - crm-network

  # --- n8n ---
  n8n:
    image: n8nio/n8n:latest
    restart: always
    environment:
      - N8N_HOST=n8n.mdrinformaticaecelulares.com.br
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.mdrinformaticaecelulares.com.br/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - crm-network

  # --- Redis ---
  redis:
    image: redis:alpine
    restart: always
    networks:
      - crm-network

  # --- Evolution API ---
  evolution:
    image: evoapicloud/evolution-api:v2.3.6
    restart: always
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=https://whatsapp.mdrinformaticaecelulares.com.br
      - CORS_ORIGIN=*
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=MDR_SECRET_TOKEN_2024
      - MANAGER_TOKEN=MDR_SECRET_TOKEN_2024
      - AUTH_TOKEN=MDR_SECRET_TOKEN_2024
      - DEL_INSTANCE_ON_DISCONNECT=false
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://mdr_user:MDR_DB_PASS_2024@db:5432/infra_db?schema=public
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_CLIENT=postgresql
      - DATABASE_SAVE_DATA_HISTORY_MESSAGES=false
      - DATABASE_SAVE_DATA_CHATS=false
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - REDIS_PREFIX=EVO
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX=EVO_CACHE
      - WEBHOOK_GLOBAL_URL=http://app:3000/api/webhooks/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1032750324
      - WA_VERSION=2.3000.1032750324
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      - db
      - redis
    networks:
      - crm-network

  # --- Postgres (Shared for infra) ---
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=MDR_DB_PASS_2024
      - POSTGRES_USER=mdr_user
      - POSTGRES_DB=infra_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge
  supabase_default:
    external: true

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  evolution_data:
  db_data:
