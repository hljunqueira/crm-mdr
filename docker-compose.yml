

services:
  app:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - IS_VPS=true
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      - ASAAS_API_URL=${ASAAS_API_URL}
    networks:
      - crm-network

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - crm-network
      - supabase_default

networks:
  crm-network:
    driver: bridge
  supabase_default:
    external: true

volumes:
  caddy_data:
  caddy_config:
